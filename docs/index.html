<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snapscore Live</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--y:#FFFC00;--k:#000;--w:#fff;--g:#f2f2f2;--mut:#7a7a7a;--blue:#0FADFF;--red:#F23C57;--green:#20C05C;--purple:#A05DCD}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{font-family:"Avenir Next","Nunito",system-ui,sans-serif;background:var(--y);color:var(--k);min-height:100vh;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:440px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ghost{width:44px;height:44px}
.clock{font-weight:900;text-align:right;font-size:14px;line-height:1.2}
.clock span{display:block;font-size:22px}
.card{background:var(--w);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.profile{display:flex;align-items:center;gap:14px}
.bit{width:68px;height:68px;border-radius:50%;background:var(--y);border:3px solid var(--k);display:grid;place-items:center;font-size:34px}
.name{font-weight:900;font-size:22px}
.user{color:var(--mut);font-weight:700;font-size:14px}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-weight:900;font-size:11px;padding:3px 9px;border-radius:99px;margin-top:4px}
.live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.2}}
.score{font-size:52px;font-weight:900;letter-spacing:-1px;margin-top:16px;font-variant-numeric:tabular-nums}
.sub{color:var(--mut);font-weight:700;font-size:13px}
.lbl{font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:8px}
.big{font-size:30px;font-weight:900}
.eta{font-size:20px;font-weight:900;color:var(--blue);margin-top:4px}
.bar{height:14px;background:var(--g);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar div{height:100%;background:var(--k);border-radius:99px;transition:width .6s}
.row{display:flex;gap:10px}
.stat{flex:1;background:var(--g);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat small{font-weight:800;color:var(--mut);font-size:11px}
.acc b{color:var(--green)}
input{width:100%;font:inherit;font-weight:900;font-size:22px;padding:14px 18px;border-radius:99px;border:3px solid var(--k);outline:none;margin-bottom:10px}
button{width:100%;font:inherit;font-weight:900;font-size:18px;padding:14px;border-radius:99px;border:0;background:var(--blue);color:#fff;cursor:pointer}
button:active{transform:scale(.97)}
.ghostbtn{background:transparent;color:var(--mut);font-size:13px;padding:8px;margin-top:6px}
.hist{list-style:none;max-height:220px;overflow:auto}
.hist li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--g);font-weight:800;font-size:14px}
.hist .d{color:var(--green)}
canvas{width:100%;height:150px;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(100px);background:var(--k);color:var(--y);font-weight:900;padding:12px 22px;border-radius:99px;transition:.3s}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <svg class="ghost" viewBox="0 0 100 100"><path d="M50 8c-17 0-28 13-28 30v12c-3 0-8-1-9 2s6 5 8 6c-2 6-9 13-16 15 0 3 7 4 11 5 1 3 1 6 4 6 4 0 8-3 16-1 6 2 9 8 14 8s8-6 14-8c8-2 12 1 16 1 3 0 3-3 4-6 4-1 11-2 11-5-7-2-14-9-16-15 2-1 9-3 8-6s-6-2-9-2V38C78 21 67 8 50 8z" fill="#fff" stroke="#000" stroke-width="5" stroke-linejoin="round"/></svg>
    <div class="clock"><span id="time">--:--</span><div id="date"></div></div>
  </div>

  <div class="card">
    <div class="profile">
      <div class="bit">👻</div>
      <div>
        <div class="name">Sara</div>
        <div class="user">sara_prins240</div>
        <div class="live"><i></i>LIVE</div>
      </div>
    </div>
    <div class="score" id="score">—</div>
    <div class="sub" id="scoreSub">Loading scores…</div>
  </div>

  <div class="card">
    <div class="lbl">🔮 Forecast · next big number</div>
    <div class="big" id="target">—</div>
    <div class="eta" id="eta">Needs 2 updates to predict</div>
    <div class="sub" id="etaRel"></div>
    <div class="bar"><div id="prog" style="width:0"></div></div>
    <div class="sub" id="toGo"></div>
    <div class="row" style="margin-top:14px">
      <div class="stat acc"><b id="acc">—</b><small>ACCURACY</small></div>
      <div class="stat"><b id="rate">—</b><small>PER HOUR</small></div>
      <div class="stat"><b id="day">—</b><small>PER DAY</small></div>
    </div>
  </div>

  <div class="card">
    <div class="lbl">📈 Score trend</div>
    <canvas id="chart"></canvas>
  </div>

  <div class="card">
    <div class="lbl">➕ New update</div>
    <input id="in" type="text" inputmode="numeric" autocomplete="off" placeholder="Enter new snapscore">
    <button id="add">Update Score</button>
    <button class="ghostbtn" id="undo">Undo last</button>
  </div>

  <div class="card">
    <div class="lbl">🕒 History</div>
    <ul class="hist" id="hist"></ul>
    <button class="ghostbtn" id="reset">Reset all data</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// Shared via the Cloudflare Worker API; falls back to this browser only if the API is unreachable.
const KEY='snapscore_sara_prins240';let S={pts:[]};let shared=true;
try{S.pts=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
if(!S.pts.length)S.pts=[{id:'1791015771356',t:1791015771356,s:24388}];
const cache=()=>{try{localStorage.setItem(KEY,JSON.stringify(S.pts))}catch(e){}};
async function load(){
  try{const r=await fetch('/api/scores',{cache:'no-store'});if(!r.ok)throw 0;S.pts=(await r.json()).pts;shared=true;cache();render()}
  catch(e){shared=false}
}
async function api(method,path,body,local){
  if(!shared){local();cache();render();return true}
  try{
    const r=await fetch(path,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
    const j=await r.json();if(j.pts){S.pts=j.pts;cache();render()}
    if(!r.ok){toast(j.error||'Could not save, try again');return false}
    return true;
  }catch(e){toast('Could not save, check your connection');return false}
}
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString();

// weighted linear regression (recent points matter more) -> points per ms
function model(){
  const p=S.pts; if(p.length<2) return null;
  const n=p.length; let sw=0,sx=0,sy=0;
  const w=p.map((_,i)=>Math.pow(1.6,i-(n-1)));
  p.forEach((q,i)=>{sw+=w[i];sx+=w[i]*q.t;sy+=w[i]*q.s});
  const mx=sx/sw,my=sy/sw;let num=0,den=0;
  p.forEach((q,i)=>{num+=w[i]*(q.t-mx)*(q.s-my);den+=w[i]*(q.t-mx)**2});
  const slope=den?Math.max(num/den,0):0;
  return {slope,last:p[n-1]};
}
function milestone(s){
  const step=s<10000?1000:s<100000?5000:s<1000000?10000:s<10000000?100000:1000000;
  return (Math.floor(s/step)+1)*step;
}
function errs(){
  const all=S.pts,out=[];
  for(let i=2;i<all.length;i++){
    S.pts=all.slice(0,i);const M=model();
    const last=all[i-1],gain=all[i].s-last.s;
    if(M&&gain>0){const pg=M.slope*(all[i].t-last.t);out.push(Math.min(1,Math.abs(pg-gain)/Math.max(gain,1)))}
  }
  S.pts=all;return out;
}
function accuracy(){
  const E=errs();if(!E.length) return null;
  const e=E.slice(-10);
  const mape=e.reduce((a,b)=>a+b,0)/e.length;
  const conf=1-Math.exp(-S.pts.length/4);           // more data = more trust
  return Math.max(0,Math.min(99.9,(100-mape*100)*(0.6+0.4*conf)));
}
function rel(ms){
  if(ms<0) return 'any moment now';
  const m=ms/6e4,h=m/60,d=h/24;
  if(m<60) return 'in '+Math.round(m)+' min';
  if(h<48) return 'in '+h.toFixed(1)+' hours';
  return 'in '+d.toFixed(1)+' days';
}

async function addScore(v){
  const last=S.pts[S.pts.length-1];
  if(last&&v<last.s){toast('Must be at least '+fmt(last.s));return}
  const t=Date.now();
  await api('POST','/api/scores',{s:v},()=>{S.pts.push({id:String(t),t,s:v})})&&toast('Score updated ✨');
}

function render(){
  const p=S.pts,h=$('hist');
  h.innerHTML=p.slice().reverse().map((q,i,a)=>{
    const prev=a[i+1],d=prev?q.s-prev.s:0;
    const dt=new Date(q.t);
    return `<li><span>${dt.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'})} ${dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span><span>${fmt(q.s)} ${prev?`<span class="d">+${fmt(d)}</span>`:''}</span></li>`
  }).join('')||'<li><span class="sub">No updates yet</span></li>';
  const a=accuracy(); $('acc').textContent=a==null?'—':a.toFixed(1)+'%';
  drawChart(); tick();
}

function tick(){
  const now=new Date();
  $('time').textContent=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('date').textContent=now.toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'});
  const p=S.pts; if(!p.length) return;
  const last=p[p.length-1], M=model();
  const est=M?last.s+M.slope*(now-last.t):last.s;
  $('score').textContent=fmt(est);
  $('scoreSub').textContent=M&&M.slope>0?`Estimated live · last confirmed ${fmt(last.s)}`:`Confirmed ${new Date(last.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
  const tgt=milestone(est); $('target').textContent=fmt(tgt);
  const step=tgt-milestone(tgt-1)+ (tgt-milestone(tgt-1)===0?0:0);
  const base=tgt-(tgt>=10000000?1000000:tgt>1000000?100000:tgt>100000?10000:tgt>10000?5000:1000);
  $('prog').style.width=Math.max(0,Math.min(100,(est-base)/(tgt-base)*100))+'%';
  $('toGo').textContent=fmt(tgt-est)+' to go';
  if(!M||M.slope<=0){$('eta').textContent=p.length<2?'Needs 2 updates to predict':'No growth yet…';$('etaRel').textContent='';$('rate').textContent='—';$('day').textContent='—';return}
  const at=new Date(last.t+(tgt-last.s)/M.slope);
  $('eta').textContent=at.toLocaleDateString([], {weekday:'long',day:'numeric',month:'short'})+' · '+at.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  $('etaRel').textContent=rel(at-now);
  $('rate').textContent=fmt(M.slope*36e5);
  $('day').textContent=fmt(M.slope*864e5);
}

function drawChart(){
  const c=$('chart'),r=devicePixelRatio||1,W=c.clientWidth,H=150;
  c.width=W*r;c.height=H*r;const x=c.getContext('2d');x.scale(r,r);x.clearRect(0,0,W,H);
  const p=S.pts;if(p.length<2){x.fillStyle='#7a7a7a';x.font='800 13px Nunito';x.fillText('Chart appears after 2 updates',10,80);return}
  const M=model(),t0=p[0].t,lt=p[p.length-1].t,t1=lt+(lt-t0)*.35;
  const s0=p[0].s,s1=Math.max(p[p.length-1].s+M.slope*(t1-lt),p[p.length-1].s+1);
  const X=t=>10+(t-t0)/(t1-t0)*(W-20),Y=s=>H-12-(s-s0)/(s1-s0)*(H-24);
  x.setLineDash([6,6]);x.strokeStyle='#0FADFF';x.lineWidth=3;x.beginPath();
  x.moveTo(X(lt),Y(p[p.length-1].s));x.lineTo(X(t1),Y(s1));x.stroke();x.setLineDash([]);
  x.strokeStyle='#000';x.lineWidth=4;x.lineJoin='round';x.beginPath();
  p.forEach((q,i)=>i?x.lineTo(X(q.t),Y(q.s)):x.moveTo(X(q.t),Y(q.s)));x.stroke();
  p.forEach(q=>{x.fillStyle='#FFFC00';x.strokeStyle='#000';x.lineWidth=3;x.beginPath();x.arc(X(q.t),Y(q.s),5,0,7);x.fill();x.stroke()});
}

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1800)}
$('add').onclick=()=>{const raw=$('in').value.replace(/[^0-9]/g,'');const v=parseInt(raw,10);if(!(v>=0)){toast('Enter a number');return}addScore(v);$('in').value=''};
$('in').onkeydown=e=>{if(e.key==='Enter')$('add').click()};
$('undo').onclick=async()=>{if(S.pts.length<2)return;await api('DELETE','/api/scores/last',null,()=>{S.pts.pop()})&&toast('Removed last update')};
let armed=0;$('reset').onclick=async()=>{
  if(Date.now()-armed>4000){armed=Date.now();$('reset').textContent='Tap again to delete everything';setTimeout(()=>$('reset').textContent='Reset all data',4000);return}
  armed=0;$('reset').textContent='Reset all data';
  await api('DELETE','/api/scores',null,()=>{S.pts=S.pts.slice(-1)})&&toast('History cleared');
};
addEventListener('resize',drawChart);
render();setInterval(tick,1000);load();setInterval(load,15000);
</script>
</body>
</html>
